name: Publicar portafolio en GitHub Pages

# Se ejecuta al hacer push a master (cuando agregues nuevos proyectos
# a data/projects.json) y también permite ejecutarlo manualmente.
on:
  push:
    branches: [master]
    paths:
      - "data/**"
      - "templates/**"
      - "static/**"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio (rama master)
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar data/projects.json
        run: python -c "import json; json.load(open('data/projects.json', encoding='utf-8'))"

      - name: Generar sitio estático en _site/
        run: python scripts/build.py

      - name: Publicar en la rama gh-pages (GitHub Pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean-exclude: |
            .nojekyll
          single-commit: true
