<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{DESCRIPCION}}" />
  <title>{{TITULO}} · Portafolio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="hero">
    <h1>👋 Hola, soy <span class="accent">{{NOMBRE}}</span></h1>
    <p class="subtitulo">{{RESUMEN}}</p>
    <p class="links">
      <a href="https://github.com/{{USUARIO_GITHUB}}" target="_blank" rel="noopener">GitHub</a> ·
      <a href="mailto:{{EMAIL}}">Email</a>
    </p>
    <p class="contador">{{CANTIDAD}} proyectos publicados</p>
  </header>

  <main>
    <section id="proyectos">
      <h2>Proyectos</h2>
      <nav class="filtros">{{CATEGORIAS}}</nav>
      <div class="grid">
{{TARJETAS}}
      </div>
    </section>
  </main>

  <footer>
    <p>© {{ANIO}} {{NOMBRE}} · Generado con GitHub Actions y publicado en GitHub Pages</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
